# The Python the agent runs inside Console. Every trial records this lockfile's hash.
#
# great-tables and nokap are pinned to main SHAs until their next releases (plan §10 Q4):
# GT main has fixes past v1.1.0 (e.g. #1008, nanoplots on pandas int64), and nokap's
# sandbox support (install-chrome, NOKAP_CHROME_ARGS) isn't on PyPI yet.
[project]
name = "gt-eval-agent-env"
version = "0"
requires-python = "==3.12.*"
dependencies = [
  "great-tables",
  "nokap",
  "polars==2.1.0",
  "pandas",
  "numpy",
  "matplotlib",
  "pyarrow",
]

[tool.uv]
package = false

[tool.uv.sources]
great-tables = { git = "https://github.com/posit-dev/great-tables", rev = "024ca9d1bbfafb2cb5fa5e98e82377b341b8268a" }
nokap = { git = "https://github.com/posit-dev/nokap", rev = "c74bd46d59353f31a4a750c0168a50e9016bd356" }
